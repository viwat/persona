spring:
  application:
    name: persona

  # Disable remote config sources for local development
  cloud:
    vault:
      enabled: false
    config:
      enabled: false

  datasource-pg:
    jdbc-url: jdbc:postgresql://localhost:5432/persona
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  # H2 in-memory DB simulating Oracle source tables (read-only migration source)
  datasource-oracle:
    jdbc-url: jdbc:h2:mem:oracle_src;MODE=Oracle;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        default_schema: public
        dialect_resolvers: org.hibernate.engine.jdbc.dialect.internal.StandardDialectResolver
        hbm2ddl:
          auto: update

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 6MB

  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 3000
      connect-timeout: 5000
      ssl:
        enabled: false
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2
          max-wait: 1000
          time-between-eviction-runs: 60000
        shutdown-timeout: 100ms

persona:
  migration:
    stale-blocking-job-minutes: 5
    async:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 50
  application:
    async:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 50

system:
  env: "local"
  redis-ttl:
    setting-ms: 172800
    favorite-ms: 172800
    schedule-ms: 172800
  cdp:
    base-url: "http://localhost"
    account-info-url: "/v3/account/detail"
    timeout: 5

# ── Pinless feature configuration ────────────────────────────────────────────
pinless:
  system:
    caps:
      USD: 1000.00
      KHR: 4000000.00
    min-thresholds:
      USD: 1.00
      KHR: 4000.00

  defaults:
    threshold-amount:
      USD: 50.00
      KHR: 200000.00
    threshold-enabled: true

  exchange:
    rates:
      USD:
        KHR: 4000.00
      KHR:
        USD: 0.00025

  cache:
    ttl-minutes: 5
    key-prefix: "local"

meilisearch:
  enabled: true
  host: http://localhost:7700
  masterKey: masterKey
  index:
    locations: locations
  search:
    default-limit: 20
    max-limit: 100

storage:
  s3:
    bucket: location-images
    region: ap-southeast-1
    access-key: minioadmin
    secret-key: minioadmin
    endpoint-override: http://localhost:9000
    public-base-url: http://localhost:9000/location-images

location:
  cache:
    ttl-seconds: 300
    nearby-ttl-seconds: 60
    all-locations-ttl-seconds: 600
  search:
    nearby-default-radius-km: 5.0
    nearby-max-radius-km: 50.0

resilience4j:
  circuitbreaker:
    instances:
      meilisearch:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 10s
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 2s
      redis:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        slow-call-duration-threshold: 300ms
        slow-call-rate-threshold: 50
        permitted-number-of-calls-in-half-open-state: 2
        wait-duration-in-open-state: 10s
      pinlessRedis:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
  retry:
    instances:
      meilisearch:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
