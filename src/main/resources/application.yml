spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: persona

management:
  endpoints:
    web:
      exposure:
        include: refresh, bus-refresh, health, prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

---
# Cloud Config + Vault — only in deployed (non-local) environments
spring:
  config:
    activate:
      on-profile: "!local"
    import:
      - "optional:vault://"
      - "optional:configserver:"
  cloud:
    config:
      uri: ${MSA_CONFIG}
      name: persona
    vault:
      uri: ${VAULT_URL}
      enabled: true
      namespace: wingbank/${VAULT_NS}
      fail-fast: true
      authentication: KUBERNETES
      kubernetes:
        role: msa-persona-sa-role
        kubernetes-path: jwt
        service-account-token-file: /var/run/secrets/tokens/vault-token
      kv:
        enabled: true
        backend: secret
        profile-separator: '/'
        application-name: msa-general
        default-context: msa-general
        profiles: ${VAULT_NS}
