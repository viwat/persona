services:
  postgres:
    image: postgres:16-alpine
    container_name: persona-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: persona
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - persona-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d persona"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: persona-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  persona-db-data:
